name: Release personal Mac build
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify fork checks
        run: bash scripts/check-maintenance.sh
      - name: Package universal fork
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/package-personal.sh "$TAG"
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/Crisp-personal.zip dist/SHA256SUMS \
            --verify-tag --title "Crisp Personal ${TAG#v}" \
            --notes 'Personal fork with display and brightness patches. 100% vibe-coded changes, provided as is. macOS 14+, Apple silicon and Intel. Ad-hoc signed, not notarized. Upstream Sparkle updates are disabled in this package; update through gbettineschi/tap.'
  tap:
    needs: package
    permissions:
      contents: read
    uses: gbettineschi/homebrew-tap/.github/workflows/publish.yml@main
    with:
      package: crisp-personal
      tag: ${{ github.ref_name }}
    secrets:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
